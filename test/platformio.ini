; Standalone sensor test — Soil moisture (D0) + DHT11 (D2) on the XIAO ESP32S3.
; Build + upload from THIS folder:
;   cd Test
;   pio run -t upload
;   pio device monitor         (115200 baud)
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
    adafruit/Adafruit SSD1306@^2.5.9
build_flags =
    ; route Serial over the native USB-C port (otherwise the monitor stays blank)
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
