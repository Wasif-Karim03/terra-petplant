; PlatformIO Project Configuration File
; PetPlant — Seeed Studio XIAO ESP32S3 (ESP32-S3R8, 8MB PSRAM, 8MB flash, native USB-C)
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; --- Libraries ---
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    beegee-tokyo/DHT sensor library for ESPx@^1.19.0
    lovyan03/LovyanGFX@^1.2.0
    earlephilhower/ESP8266Audio@^1.9.7
    https://github.com/tzapu/WiFiManager.git

; --- Speeds ---
monitor_speed = 115200
upload_speed = 921600

; --- Flash: 8MB (XIAO ESP32S3 has 8MB flash) ---
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
; Custom 8MB table: single app + large LittleFS for voice clips
board_build.partitions = partitions_petplant.csv
board_build.filesystem = littlefs

; --- PSRAM: 8MB Octal SPI PSRAM on the ESP32-S3R8 ---
board_build.arduino.memory_type = qio_opi

build_flags =
    ; CRITICAL: route Serial over the native USB-C CDC port.
    ; Without this the USB serial monitor stays blank on the XIAO.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Use the USB-OTG (native) peripheral, not a UART bridge.
    -D ARDUINO_USB_MODE=1
    ; Enable PSRAM in the Arduino core.
    -D BOARD_HAS_PSRAM
