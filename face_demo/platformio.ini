; Standalone display demo — cycles all Terra emotions on the SSD1306 mono OLED
; using the real src/mono_face.h driver (no WiFi/sensors/voice). Upload with:
;   pio run -d face_demo -t upload   &&   pio device monitor
[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D DISPLAY_DRIVER=2        ; select the v2 mono driver
    -I ../src                  ; pull in display.h + mono_face.h from the main project
